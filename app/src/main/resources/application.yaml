spring:
  application:
    name: resource-magnate

  profiles:
    default: local

  jpa:
    open-in-view: false

  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always