spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resource_magnate}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

logging:
  level:
    root: INFO

    # Твои классы: ошибки и ход выполнения приложения
    com.resourcemagnate.app: DEBUG

    # Входящие HTTP-запросы и обработка контроллеров
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG

    # Spring Security: почему запрос разрешён или заблокирован
    org.springframework.security: TRACE

    # SQL-запросы Hibernate
    org.hibernate.SQL: DEBUG

    # Значения параметров SQL (Hibernate 6)
    org.hibernate.orm.jdbc.bind: TRACE

    # Flyway — выполнение миграций
    org.flywaydb: INFO

server:
  error:
    include-message: always

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
